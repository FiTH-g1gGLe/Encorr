name: Test and build

# Every push to main is tested, built and published as the newest release.
# The download links never change:
#   https://github.com/FiTH-g1gGLe/Encorr/releases/latest/download/Encorr-Windows.zip
#   https://github.com/FiTH-g1gGLe/Encorr/releases/latest/download/Encorr-Linux-amd64.tar.gz
# and the Docker image is ghcr.io/fith-g1ggle/encorr:latest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # go.sum is filled in on the build machine (dependencies are downloaded there).
  GOFLAGS: -mod=mod

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Windows details (name, publisher, version, icon)
        # A program with proper version details and an icon looks like normal
        # software to antivirus; a bare unlabelled exe gets flagged more often.
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in build/winres/winres.json --out cmd/encorr/rsrc --arch amd64 \
            --file-version "${VERSION}.0" --product-version "${VERSION}.0"
          ls -la cmd/encorr/
      - name: Build Windows (TMDB key comes from the repo secret, never committed)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
          # Either secret works: the long Read Access Token (as in Rennix) or the short API Key (as in AxiomTV).
          TMDB_KEY: ${{ secrets.TMDB_READ_TOKEN || secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_KEY" ]; then echo "No TMDB secret set: users will be asked for a key"; else echo "TMDB key bundled"; fi
          LDF="-X github.com/FiTH-g1gGLe/encorr/internal/app.Version=${VERSION} -X github.com/FiTH-g1gGLe/encorr/internal/tmdb.BuiltInKey=${TMDB_KEY}"
          mkdir -p out dist
          go build -trimpath -ldflags "$LDF" -o out/encorr.exe ./cmd/encorr
          cp README.md TESTING.md LICENSE out/
          cd out && zip -9 ../dist/Encorr-Windows.zip *
      - name: Build Linux (amd64 and arm64)
        env:
          CGO_ENABLED: "0"
          TMDB_KEY: ${{ secrets.TMDB_READ_TOKEN || secrets.TMDB_API_KEY }}
        run: |
          LDF="-s -w -X github.com/FiTH-g1gGLe/encorr/internal/app.Version=${VERSION} -X github.com/FiTH-g1gGLe/encorr/internal/tmdb.BuiltInKey=${TMDB_KEY}"
          for arch in amd64 arm64; do
            rm -rf lin && mkdir -p lin
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LDF" -o lin/encorr ./cmd/encorr
            cp README.md LICENSE docs/DOCKER.md lin/
            tar -C lin -czf dist/Encorr-Linux-$arch.tar.gz .
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Encorr-${{ env.VERSION }}
          path: dist/*
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes: the commit's title and its "- " lines.
          {
            echo "## What's new"
            git log -1 --format=%s
            git log -1 --format=%b | grep -E '^- ' | head -8 || true
            echo ""
            echo "**Windows:** Encorr-Windows.zip below. Unzip it and double-click encorr.exe."
            echo ""
            echo "**Docker / Portainer:** \`ghcr.io/fith-g1ggle/encorr:latest\` (see docs/DOCKER.md). **Linux without Docker:** the Encorr-Linux tar.gz for your machine."
          } > notes.txt
          gh release create "v${VERSION}" dist/Encorr-Windows.zip dist/Encorr-Linux-amd64.tar.gz dist/Encorr-Linux-arm64.tar.gz \
            --title "Encorr ${VERSION}" --notes-file notes.txt --target "${GITHUB_SHA}" --latest

  docker:
    name: Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: 0.1.${{ github.run_number }}
      IMAGE: ghcr.io/fith-g1ggle/encorr
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          secrets: |
            tmdb=${{ secrets.TMDB_READ_TOKEN || secrets.TMDB_API_KEY }}
          labels: |
            org.opencontainers.image.title=Encorr
            org.opencontainers.image.description=Request the encore: a media request app for Plex and Jellyfin
            org.opencontainers.image.source=https://github.com/FiTH-g1gGLe/Encorr
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
